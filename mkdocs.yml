site_name: Curso de Kubernetes con k3s
site_description: Documentación y prácticas del curso de Kubernetes
site_author: Guillem Hernandez Sola

repo_name: agile611/startusingkubernetes
repo_url: https://github.com/agile611/startusingkubernetes

theme:
  name: material
  language: es
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Cambiar al modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Cambiar al modo claro

nav:
  - Inicio: index.md
  - Preparación del entorno:
      - Instalación: instalacion.md
      - Crear el clúster con k3d: cluster-k3d.md
  - Primera práctica:
      - Probar el clúster con Nginx: prueba-nginx.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite

plugins:
  - search
